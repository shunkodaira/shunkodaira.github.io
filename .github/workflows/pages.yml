name: Publish portfolio

on:
  push:
    branches: [main]
    paths: [portfolio-static.zip, .github/workflows/pages.yml, 'intro/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract the portfolio
        run: |
          unzip -q portfolio-static.zip -d site
          test -s site/index.html
          test -s site/blog/index.html
      - name: Add the water intro to older site bundles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          homepage = Path("site/index.html")
          html = homepage.read_text(encoding="utf-8")
          if 'class="water-intro"' not in html:
              html = html.replace(
                  '</head>',
                  '<link rel="stylesheet" href="/water-intro.css"><script defer src="/water-intro.js"></script></head>',
                  1,
              )
              html = html.replace(
                  '<div class="site">',
                  '<div class="site"><div class="water-intro" aria-hidden="true"><canvas></canvas></div>',
                  1,
              )
              assert 'class="water-intro"' in html
              homepage.write_text(html, encoding="utf-8")
              for asset in ("water-intro.css", "water-intro.js"):
                  Path("site", asset).write_bytes(Path("intro", asset).read_bytes())
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
